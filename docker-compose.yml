# PostgreSQL cho môi trường phát triển.
# Lệnh dùng:  npm run db:up   (khởi động, chờ healthy)
#             npm run db:stop (dừng, GIỮ dữ liệu)
# CẢNH BÁO:  `docker compose down -v` sẽ XÓA volume dữ liệu — không chạy nếu chưa sao lưu.
name: web-kpi

services:
  db:
    image: postgres:16-alpine
    container_name: web-kpi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-web_kpi_dev}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
      TZ: UTC
    ports:
      # Chỉ lắng nghe trên máy local, không mở ra mạng LAN
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Script chạy MỘT LẦN khi volume còn trống: tạo database kiểm thử web_kpi_test
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
    name: web-kpi-pgdata
